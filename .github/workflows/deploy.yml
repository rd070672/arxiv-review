# Sample workflow for building and deploying a VitePress site to GitHub Pages
#
name: Deploy VitePress site to Pages

on:
  # Runs on pushes targeting the `main` branch. Change this to `master` if you're
  # using the `master` branch as the default branch.
  push:
    branches: [main]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment.
# Keep the currently running deployment alive; newer runs will wait/pending.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Keep full history for safer diff handling in later jobs
      # - uses: pnpm/action-setup@v3 # Uncomment this block if you're using pnpm
      #   with:
      #     version: 9 # Not needed if you've set "packageManager" in package.json
      # - uses: oven-sh/setup-bun@v1 # Uncomment this if you're using Bun
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm # or pnpm / yarn
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Install dependencies
        run: npm ci # or pnpm install / yarn install / bun install
      - name: Build with VitePress
        run: npm run docs:build # or pnpm docs:build / yarn docs:build / bun run docs:build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Slack notification job
  notify:
    needs: deploy
    if: ${{ needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    name: Notify Slack

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect newly added topic markdown files
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          # Manual runs should not send article notifications
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "has_new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"

          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            FILES=$(git diff-tree --no-commit-id --name-only --diff-filter=A -r "$AFTER" | grep '^src/topic/.*\.md$' || true)
          else
            FILES=$(git diff --name-only --diff-filter=A "$BEFORE" "$AFTER" | grep '^src/topic/.*\.md$' || true)
          fi

          if [ -z "$FILES" ]; then
            echo "has_new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "has_new=true"
            echo "files<<EOF"
            echo "$FILES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build Slack payload
        if: steps.detect.outputs.has_new == 'true'
        env:
          BASE_URL: ${{ needs.deploy.outputs.page_url }}
          NEW_FILES: ${{ steps.detect.outputs.files }}
        run: |
          python - <<'PY' > payload.json
          import json
          import os
          import re
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo

          base = os.environ["BASE_URL"].rstrip("/")
          files = [f.strip() for f in os.environ["NEW_FILES"].splitlines() if f.strip()]
          notify_time = datetime.now(ZoneInfo("Asia/Tokyo")).strftime("%Y-%m-%d")

          def extract_title(text: str, path: str) -> str:
              # 1) front matter の title を優先
              if text.startswith("---\n"):
                  parts = text.split("\n---\n", 1)
                  if len(parts) == 2:
                      frontmatter = parts[0][4:]
                      m = re.search(r'^title\s*:\s*["\']?(.*?)["\']?\s*$', frontmatter, re.MULTILINE)
                      if m and m.group(1).strip():
                          return m.group(1).strip()

              # 2) 最初の H1 を使う
              m = re.search(r'^\#\s+(.+?)\s*$', text, re.MULTILINE)
              if m and m.group(1).strip():
                  return m.group(1).strip()

              # 3) 最後の保険としてファイル名
              return Path(path).stem

          article_blocks = []

          for i, path_str in enumerate(files, start=1):
              path = Path(path_str)
              text = path.read_text(encoding="utf-8")

              slug = path_str[len("src/topic/"):]
              if slug.endswith(".md"):
                  slug = slug[:-3]

              title = extract_title(text, path_str)
              url = f"{base}/topic/{slug}"

              block = (
                  f"論文-{i}\n"
                  f"タイトル：{title}\n"
                  f"リンク：{url}"
              )
              article_blocks.append(block)

          payload_text = (
              "新しいレビュー記事を公開しました。\n"
              f"日時：{notify_time}\n\n"
              + "\n\n".join(article_blocks)
          )

          payload = {"text": payload_text}
          print(json.dumps(payload, ensure_ascii=False))
          PY

      - name: Post to Slack
        if: steps.detect.outputs.has_new == 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H 'Content-type: application/json' \
            --data @payload.json \
            "$SLACK_WEBHOOK_URL"